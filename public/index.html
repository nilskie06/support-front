<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <style>
      /* Initial Application Preloader (Active before Vue mounts) */
      #app-initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f3f3f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        z-index: 9999999;
      }
      .app-loader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 36px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .app-loader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e9ebec;
        border-top-color: #405189;
        border-radius: 50%;
        animation: app-loader-spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        margin-bottom: 16px;
      }
      .app-loader-title {
        font-size: 15px;
        font-weight: 600;
        color: #212529;
        margin-bottom: 4px;
      }
      .app-loader-subtitle {
        font-size: 12px;
        color: #878a99;
      }
      @keyframes app-loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div id="app-initial-loader">
        <div class="app-loader-card">
          <div class="app-loader-spinner"></div>
          <div class="app-loader-title">Loading Application</div>
          <div class="app-loader-subtitle">Please wait a moment...</div>
        </div>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
